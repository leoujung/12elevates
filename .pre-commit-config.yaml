# pre-commit configuration (PSI P0 Phase 1).
# Gitleaks runs as a LOCAL hook using a binary whose SHA-256 was verified against
# the upstream checksums file (gitleaks v8.30.1, windows_x64). The hook does not
# download anything at commit time, so no unverified binary is ever executed.
#
# Install once per clone:  pre-commit install
# Run on all files:        pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: gitleaks-protect-staged
        name: gitleaks (staged changes)
        description: Block commits that add secrets to staged content.
        # Absolute path: pre-commit does not inherit the shell PATH. Each developer
        # sets GITLEAKS_BIN to the checksum-verified binary (see docs/ai/PSI_SECRET_SCANNING.md).
        entry: sh -c 'exec "${GITLEAKS_BIN:?set GITLEAKS_BIN to a verified gitleaks binary}" protect --staged --redact --config .gitleaks.toml --no-banner -l warn'
        args: []
        language: system
        pass_filenames: false
        always_run: true
